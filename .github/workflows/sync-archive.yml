name: Sync Archive from Upstream

on:
  schedule:
    # 每天北京时间 10:00 和 22:00 运行
    - cron: '0 2,14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync archive from jsonleex/bing.wallpaper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://oauth2:${GITHUB_TOKEN}@github.com/jsonleex/bing.wallpaper.git upstream
          cd upstream
          git sparse-checkout set archive
          cp -rf archive/* ../archive/ || true
          cd ..
          rm -rf upstream

      - name: Commit changes
        env:
          USER_NAME: ${{ vars.USER_NAME }}
          USER_EMAIL: ${{ vars.USER_EMAIL }}
        run: |
          git config user.name "$USER_NAME"
          git config user.email "$USER_EMAIL"
          git add ./archive
          git diff --staged --quiet || git commit -m "sync archive from jsonleex/bing.wallpaper $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
